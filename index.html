<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subway Hero Run</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --page: #f1ecfb;
    --ink: #2b2146;
    --line: #8d79c9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #120d24; --ink: #e9e3ff; --line: #6a58b0; }
  }
  :root[data-theme="dark"] { --page: #120d24; --ink: #e9e3ff; --line: #6a58b0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    min-height: 100%;
    padding: 12px;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    overflow-x: hidden;
  }
  #stage { width: min(100%, 480px, max(260px, calc((100vh - 190px) * 0.6667))); }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 480 / 720;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(110, 60, 200, .35);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .pad { display: grid; grid-template-columns: 1fr 1.2fr 1.2fr 1fr; gap: 10px; width: min(100%, 480px); }
  .pad button {
    font-family: "Bungee", Impact, "Arial Black", sans-serif;
    font-size: 15px;
    line-height: 1.1;
    color: #fff;
    border: 0;
    border-radius: 14px;
    padding: 14px 4px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 5px 0 rgba(0, 0, 0, .28);
    transition: transform .06s, box-shadow .06s;
  }
  #bL, #bR { background: linear-gradient(135deg, #12d6a0, #0a8bd6); }
  #bU { background: linear-gradient(135deg, #00c2ff, #7a4dff); }
  #bD { background: linear-gradient(135deg, #ff7a18, #ff2f7d); }
  .pad button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .28); }
  .pad button:focus-visible, .small:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  .hint { margin: 0; max-width: 60ch; text-align: center; font-size: 13px; line-height: 1.5; opacity: .82; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .small {
    font: inherit; font-size: 13px; color: inherit; background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; opacity: .9;
  }
  .small:hover { opacity: 1; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Subway Hero Run. Use left and right arrows to change lane, up to jump, down to roll."></canvas>
  </div>
  <div class="pad">
    <button id="bL" type="button" aria-label="Move left">◀</button>
    <button id="bU" type="button">Jump ▲</button>
    <button id="bD" type="button">Roll ▼</button>
    <button id="bR" type="button" aria-label="Move right">▶</button>
  </div>
  <p class="hint">← → change lane · ↑ / Space jump · ↓ roll · P pause · R use a key to continue. On a phone, swipe on the game. Grab magnets, 2×, jetpacks, sneakers, hoverboards and mystery boxes. Run up ramps to ride on top of trains!</p>
  <div class="row">
    <button id="change" class="small" type="button">Change hero</button>
    <button id="pause" class="small" type="button">Pause</button>
    <button id="sound" class="small" type="button" aria-pressed="true">Sound on</button>
  </div>

<script>
(() => {
  'use strict';
  const W = 480, H = 720;
  const HOR = 235, FOC = 700, ZC = 300, LANE = 62, ZFAR = 3500, ZNEAR = 110, CAM0 = 165;
  const G = 2400, VMAX = 1500, V0 = 640, ACC = 5.5;
  const TAU = Math.PI * 2;
  const FONT = '"Bungee", Impact, "Arial Black", sans-serif';
  const coarse = window.matchMedia('(pointer: coarse)').matches;

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let scale = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.width * dpr * H / W));
    scale = cv.width / W;
  }
  window.addEventListener('resize', resize);
  resize();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = a => a[(Math.random() * a.length) | 0];
  function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  /* ---------- colours ---------- */
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgb = (c, f = 1, a = 1) => 'rgba(' + Math.min(255, c[0] * f | 0) + ',' + Math.min(255, c[1] * f | 0) + ',' + Math.min(255, c[2] * f | 0) + ',' + a + ')';
  const STAGES = [
    { top: '#2a1b6e', mid: '#d4457b', bot: '#ffb347', orb: '#fff1c1', far: '#7a3f9a', mid2: '#55307f', near: '#34205c', gTop: '#5a3a82', gBot: '#2a1650', accent: '#ffd166', stars: 0.15, rain: 0, city: 0.3 },
    { top: '#0b0f3a', mid: '#4a1f8f', bot: '#ff3d9a', orb: '#e8f1ff', far: '#2f2275', mid2: '#2a2070', near: '#1b1450', gTop: '#2a2068', gBot: '#100a38', accent: '#00e5ff', stars: 1, rain: 0, city: 1 },
    { top: '#0aa5ff', mid: '#5ee7c8', bot: '#d8ff9a', orb: '#fffbd0', far: '#2d9bb5', mid2: '#2a8c9c', near: '#1d6b78', gTop: '#2f8a6a', gBot: '#12503f', accent: '#ffec5c', stars: 0, rain: 0, city: 0.2 },
    { top: '#2b1055', mid: '#6d5bd0', bot: '#c9a3ff', orb: '#f5f0ff', far: '#4a3b94', mid2: '#40338a', near: '#2a2068', gTop: '#3a2f80', gBot: '#161040', accent: '#ff7ad9', stars: 0.2, rain: 1, city: 0.5 }
  ].map(s => { const o = {}; for (const k in s) o[k] = typeof s[k] === 'string' ? hex(s[k]) : s[k]; return o; });
  const NAMES = ['Sunset Yard', 'Neon Night', 'Teal Dawn', 'Storm Rail'];
  let cur = JSON.parse(JSON.stringify(STAGES[0]));
  let stage = 0;
  function easePalette(dt) {
    const t = Math.min(1, dt * 0.9), T = STAGES[stage];
    for (const k in T) {
      if (Array.isArray(T[k])) for (let i = 0; i < 3; i++) cur[k][i] += (T[k][i] - cur[k][i]) * t;
      else cur[k] += (T[k] - cur[k]) * t;
    }
  }
  const TRAIN_COLS = [hex('#e0455a'), hex('#2f7de1'), hex('#f2b21d'), hex('#27a86b'), hex('#8f56d6'), hex('#e8e8f0')];

  /* ---------- heroes ---------- */
  const CHARS = [
    { id: 'shadow', name: 'SHADOW', tag: 'MASKED NIGHT HERO', perk: ['Magnet lasts 60% longer', 'Cool mask, cooler coat'],
      mag: 1.6, jet: 1, board: 1, jump: 1, lane: 1,
      sty: { kind: 'coat', body: '#1b2331', shine: '#5a7299', dark: '#0b0e14', skin: '#dba67f', hair: '#2b1b13', accent: '#00e5ff', boot: '#0a0c10' } },
    { id: 'ronin', name: 'RONIN', tag: 'SHADOW BLADE NINJA', perk: ['Quicker lane switch', 'Jumps 8% higher'],
      mag: 1, jet: 1, board: 1, jump: 1.08, lane: 1.3,
      sty: { kind: 'ninja', body: '#1e2d66', shine: '#5a82e0', dark: '#0b1233', skin: '#dba67f', hair: '#14141c', accent: '#ff3d5a', boot: '#0a0f24' } },
    { id: 'volt', name: 'VOLT', tag: 'JET POWER ROBOT', perk: ['Jetpack lasts 50% longer', 'Hoverboard lasts 50% longer'],
      mag: 1, jet: 1.5, board: 1.5, jump: 1, lane: 1,
      sty: { kind: 'robo', body: '#c8d4ea', shine: '#ffffff', dark: '#5a6a8c', skin: '#c8d4ea', hair: '#5a6a8c', accent: '#46e6ff', boot: '#34405c' } }
  ];
  const GUARD = { kind: 'guard', body: '#223a78', shine: '#4a6ed0', dark: '#101c3f', skin: '#d9a07a', hair: '#2a1a10', accent: '#ffe45c', boot: '#0a0f24' };
  let sel = 0;
  const ch = () => CHARS[sel];

  /* ---------- items ---------- */
  const ITEMS = {
    magnet: { name: 'MAGNET', col: '#ff4d5e', dur: 9, desc: 'Pulls in coins' },
    x2: { name: '2X', col: '#3d8bff', dur: 10, desc: 'Double score' },
    jet: { name: 'JETPACK', col: '#ff9a1f', dur: 6, desc: 'Fly over everything' },
    shoes: { name: 'SNEAKERS', col: '#35e07a', dur: 10, desc: 'Super high jumps' },
    board: { name: 'BOARD', col: '#22d6ff', dur: 20, desc: 'Absorbs one crash' },
    mystery: { name: 'MYSTERY', col: '#b266ff', dur: 0, desc: 'Random prize' },
    key: { name: 'KEY', col: '#ffd24a', dur: 0, desc: 'Continue after a crash' }
  };

  /* ---------- persistent ---------- */
  let best = 0, keys = 1, wallet = 0;
  try {
    best = parseInt(localStorage.getItem('sh-best') || '0', 10) || 0;
    const k = localStorage.getItem('sh-keys');
    keys = k === null ? 1 : parseInt(k, 10) || 0;
    wallet = parseInt(localStorage.getItem('sh-coins') || '0', 10) || 0;
  } catch (e) {}
  const save = () => { try { localStorage.setItem('sh-best', String(Math.floor(best))); localStorage.setItem('sh-keys', String(keys)); localStorage.setItem('sh-coins', String(wallet)); } catch (e) {} };

  /* ---------- state ---------- */
  let state = 'idle', paused = false;
  let time = 0, D = 0, speed = V0, score = 0, runT = 0, coinsRun = 0, deadT = 0, deadAt = 0;
  let camX = 0, camH = CAM0, shake = 0, lightning = 0, toast = null, zCur = 0, idlePh = 0;
  let objs = [], particles = [], rings = [];
  const hero = {};
  const drops = Array.from({ length: 80 }, () => ({ x: rnd(0, W + 80), y: rnd(0, H), l: rnd(12, 26), v: rnd(800, 1200) }));
  const stars = Array.from({ length: 40 }, () => ({ x: rnd(0, W), y: rnd(4, HOR - 30), r: rnd(0.7, 1.8), p: rnd(0, 6) }));

  function resetHero() {
    Object.assign(hero, { lane: 1, prevLane: 1, px: 0, h: 0, vy: 0, grounded: true, rollT: 0, ph: 0, lean: 0, rollA: 0,
      magnetT: 0, x2T: 0, jetT: 0, shoesT: 0, boardT: 0, invul: 0, chaseT: 0, slowT: 0, stumbleAnim: 0, fast: false });
  }
  resetHero();

  function reset(run) {
    objs = []; particles = []; rings = [];
    D = 0; speed = V0; score = 0; runT = 0; coinsRun = 0; stage = 0; toast = null; deadT = 0;
    camX = 0; camH = CAM0;
    resetHero();
    zCur = 1300;
    state = run ? 'run' : 'idle';
    if (run) fill();
  }

  /* ---------- audio ---------- */
  let actx = null, soundOn = true;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function beep(freq, dur, vol, slideTo, type) {
    if (!soundOn || !actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur);
  }
  let coinPitch = 0, coinPitchT = 0;
  const sfx = {
    coin: () => { coinPitch = (time - coinPitchT < 0.4) ? Math.min(coinPitch + 1, 8) : 0; coinPitchT = time; beep(900 + coinPitch * 70, 0.09, 0.04, 1500 + coinPitch * 80, 'triangle'); },
    jump: () => beep(380, 0.2, 0.05, 900, 'triangle'),
    roll: () => beep(300, 0.2, 0.04, 90, 'sawtooth'),
    lane: () => beep(520, 0.07, 0.025, 320, 'sine'),
    stumble: () => beep(180, 0.25, 0.08, 70, 'square'),
    crash: () => { beep(120, 0.5, 0.1, 40, 'sawtooth'); beep(300, 0.3, 0.06, 60, 'square'); },
    power: () => { beep(600, 0.1, 0.05, 900, 'triangle'); setTimeout(() => beep(900, 0.18, 0.05, 1500, 'triangle'), 90); },
    key: () => { beep(1000, 0.08, 0.05, 1400, 'triangle'); setTimeout(() => beep(1400, 0.2, 0.05, 1800, 'triangle'), 90); },
    board: () => beep(400, 0.35, 0.07, 80, 'sawtooth'),
    mile: () => { beep(700, 0.08, 0.04); setTimeout(() => beep(1050, 0.14, 0.04), 90); },
    jetEnd: () => beep(700, 0.4, 0.04, 150, 'sine')
  };
  const soundBtn = document.getElementById('sound');
  function toggleSound() {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  }
  soundBtn.addEventListener('click', () => { toggleSound(); soundBtn.blur(); });

  /* ---------- fx (screen space) ---------- */
  function spark(x, y, vx, vy, life, size, col, grav) {
    if (particles.length > 420) particles.shift();
    particles.push({ x, y, vx, vy, life, max: life, size, col, grav: grav || 0 });
  }
  function burst(x, y, n, cols, sp) {
    for (let i = 0; i < n; i++) spark(x, y, rnd(-sp, sp), rnd(-sp, sp * 0.6), rnd(0.35, 0.85), rnd(2.5, 5.5), cols[i % cols.length], 600);
  }
  function playerScreen() { return proj(hero.px, hero.h + 40, ZC); }

  /* ---------- projection ---------- */
  function proj(wx, wy, z) {
    const p = FOC / z;
    return [W / 2 + (wx - camX) * p, HOR + (camH - wy) * p, p];
  }
  function poly(pts, fill, stroke) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }
  function qw(x0, x1, z0, z1, y, fill) {
    z0 = Math.max(z0, ZNEAR); if (z1 <= z0) return;
    poly([proj(x0, y, z0), proj(x1, y, z0), proj(x1, y, z1), proj(x0, y, z1)], fill);
  }
  function drawBox(x0, x1, y0, y1, z0, z1, c, o) {
    o = o || {};
    const clipped = z0 < ZNEAR;
    z0 = Math.max(z0, ZNEAR); if (z1 <= z0) return;
    const P = (x, y, z) => proj(x, y, z);
    const sideX = x0 > camX ? x0 : (x1 < camX ? x1 : null);
    if (sideX !== null) poly([P(sideX, y0, z0), P(sideX, y0, z1), P(sideX, y1, z1), P(sideX, y1, z0)], rgb(c, 0.7));
    if (y1 < camH) poly([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], rgb(c, 1.15));
    if (!clipped) poly([P(x0, y0, z0), P(x1, y0, z0), P(x1, y1, z0), P(x0, y1, z0)], rgb(c, o.front === undefined ? 0.92 : o.front));
    return sideX;
  }

  /* ---------- world generation ---------- */
  const laneX = i => (i - 1) * LANE;
  function addCoin(lane, Zw, y, t) { objs.push({ t: t || 'coin', x: laneX(lane), Zw, y, len: 0, ph: rnd(0, 6) }); }
  function coinLine(lane, z0, n, step, y) { for (let i = 0; i < n; i++) addCoin(lane, z0 + i * step, y === undefined ? 24 : y); }
  function coinArc(lane, z0, n, step, base, peak) {
    for (let i = 0; i < n; i++) addCoin(lane, z0 + i * step, base + Math.sin(i / (n - 1) * Math.PI) * (peak - base), i === (n >> 1) && n > 4 ? 'scoin' : 'coin');
  }
  function addItem(lane, Zw, type, y) { objs.push({ t: 'item', type, x: laneX(lane), Zw, y: y === undefined ? 40 : y, len: 0, ph: rnd(0, 6) }); }
  function addBarrier(lane, Zw) { objs.push({ t: 'barrier', x: laneX(lane), Zw, len: 12 }); }
  function addOverhead(lane, Zw) { objs.push({ t: 'overhead', x: laneX(lane), Zw, len: 12 }); }
  function addTrain(lane, Zw, len, extra, ramp) {
    const col = pick(TRAIN_COLS), h = 130;
    if (ramp) objs.push({ t: 'ramp', x: laneX(lane), Zw, len: 170, h });
    objs.push({ t: 'train', x: laneX(lane), Zw: Zw + (ramp ? 170 : 0), len, h, col, extra: extra || 0 });
    return len + (ramp ? 170 : 0);
  }
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function pickItem() {
    const r = Math.random();
    if (r < 0.2) return 'magnet'; if (r < 0.38) return 'x2'; if (r < 0.52) return 'jet'; if (r < 0.68) return 'shoes';
    if (r < 0.82) return 'board'; if (r < 0.94) return 'mystery'; return 'key';
  }

  function seg() {
    const z = zCur, d = clamp(D / 50000, 0, 1);
    const L = shuffle([0, 1, 2]);
    let len = 0;
    const early = D < 2500;
    const r = Math.random();
    if (early) {
      if (r < 0.5) { coinLine(L[0], z, 8, 60); len = 480; }
      else { addBarrier(L[0], z + 40); coinLine(L[1], z, 6, 60); coinArc(L[0], z - 10, 7, 28, 24, 80); len = 420; }
    } else if (r < 0.14) {
      coinLine(L[0], z, 9, 60); len = 540;
    } else if (r < 0.28) {
      addBarrier(L[0], z + 60); if (Math.random() < 0.3 + d * 0.4) addBarrier(L[1], z + 60);
      const free = Math.random() < 0.5 ? L[2] : L[0];
      if (free === L[2]) coinLine(free, z, 7, 60); else coinArc(free, z - 20, 8, 22, 24, 90);
      len = 460;
    } else if (r < 0.38) {
      const n = 1 + ((Math.random() * (2 + d * 1.2)) | 0);
      for (let i = 0; i < Math.min(3, n); i++) { addOverhead(L[i], z); }
      for (let i = 0; i < Math.min(3, n); i++) coinLine(L[i], z - 30, 4, 22, 18);
      if (n < 3) coinLine(L[2], z - 100, 7, 60);
      len = 300;
    } else if (r < 0.58) {
      const two = Math.random() < 0.25 + d * 0.4;
      const tl = rnd(380, 700), ramp = Math.random() < 0.55;
      const used = addTrain(L[0], z, tl, 0, ramp);
      if (ramp) coinLine(L[0], z + 170 + 20, Math.floor((tl - 40) / 60), 60, 130 + 24);
      if (two) addTrain(L[1], z + (ramp ? 0 : 0), tl * rnd(0.6, 1), 0, false);
      coinLine(L[two ? 2 : 1], z, 9, 60);
      if (!two && Math.random() < 0.5) addBarrier(L[2], z + 140);
      len = used + 60;
    } else if (r < 0.7) {
      const tl = rnd(360, 560);
      addTrain(L[0], z, tl, 0, false);
      addBarrier(L[1], z + 80);
      coinLine(L[2], z, 8, 60);
      len = tl + 40;
    } else if (r < 0.82) {
      addItem(L[0], z + 360, pickItem());
      coinLine(L[0], z, 5, 60);
      if (Math.random() < 0.5) addBarrier(L[1], z + 150);
      len = 520;
    } else if (r < 0.9) {
      addTrain(L[0], z, 420, 360, false);
      coinLine(L[1], z, 8, 60);
      len = 520;
    } else {
      let lane = L[0];
      for (let i = 0; i < 4; i++) { addBarrier(lane, z + i * 230); coinLine((lane + 1 + (i % 2)) % 3, z + i * 230 - 60, 3, 40); lane = (lane + (i % 2 ? 1 : 2)) % 3; }
      len = 920;
    }
    zCur = z + len + Math.max(340, speed * 0.62) + rnd(0, 120);
  }
  function fill() { while (zCur < D + ZFAR) seg(); }

  /* ---------- gameplay ---------- */
  function floorAt(x) {
    let f = 0;
    for (const o of objs) {
      if (o.dead || (o.t !== 'train' && o.t !== 'ramp') || Math.abs(x - o.x) > 30) continue;
      const z0 = o.Zw - D, z1 = z0 + o.len;
      if (ZC < z0 || ZC > z1) continue;
      f = Math.max(f, o.t === 'train' ? o.h : o.h * (ZC - z0) / o.len);
    }
    return f;
  }
  const topH = () => hero.h + (hero.rollT > 0 ? 36 : 76);

  function startRun() { reset(true); }
  function doJump() {
    if (state !== 'run' || paused) return;
    if (hero.grounded && !hero.jetT) {
      const hi = hero.shoesT > 0;
      const apex = (hi ? 195 : 88) * ch().jump;
      hero.vy = Math.sqrt(2 * G * apex); hero.grounded = false; hero.rollT = 0;
      sfx.jump();
      const s = playerScreen();

      ctx.fillStyle = on ? 'rgba(18,8,52,.86)' : 'rgba(18,8,52,.62)'; rr(b.x, b.y, b.w, b.h, 16); ctx.fill();
      if (on) { ctx.shadowColor = c.sty.accent; ctx.shadowBlur = 20; }
      ctx.strokeStyle = on ? c.sty.accent : 'rgba(255,255,255,.22)'; ctx.lineWidth = on ? 3.5 : 1.5; rr(b.x, b.y, b.w, b.h, 16); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(b.x + 82, b.y + 126, 38, 8, 0, 0, TAU); ctx.fill();
      ctx.save(); ctx.shadowColor = c.sty.accent; ctx.shadowBlur = on ? 10 : 0;
      drawRunner(c.sty, { mode: on ? 'run' : 'idle', ph: on ? time * 11 : time * 3 + i }, b.x + 82, b.y + 124, 0.98);
      ctx.restore();
      label(c.name, b.x + 160, b.y + 16, 24, 'left', on ? c.sty.accent : '#fff');
      ctx.font = '600 11px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.fillText(c.tag, b.x + 160, b.y + 48);
      ctx.font = '700 11px system-ui, sans-serif'; ctx.fillStyle = c.sty.accent; ctx.fillText('PERKS', b.x + 160, b.y + 74);
      ctx.font = '13px system-ui, sans-serif'; ctx.fillStyle = '#fff';
      c.perk.forEach((t, j) => ctx.fillText('• ' + t, b.x + 160, b.y + 92 + j * 18));
    }
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(performance.now() / 300);
    label(coarse ? 'TAP A HERO · TAP AGAIN TO START' : '← →  CHOOSE     SPACE  START', W / 2, 534, 14, 'center', '#ffe9a8');
    ctx.globalAlpha = 1;
    // items legend
    ctx.fillStyle = 'rgba(18,8,52,.7)'; rr(20, 566, 440, 128, 14); ctx.fill();
    label('POWER-UP ITEMS', W / 2, 574, 12, 'center', '#ffe9a8');
    const types = ['magnet', 'x2', 'jet', 'shoes', 'board', 'mystery', 'key'];
    types.forEach((t, i) => {
      const x = 20 + 31 + i * 63, y = 618;
      drawItemIcon(t, x, y, 15, 0);
      ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#fff';
      ctx.fillText(ITEMS[t].name, x, y + 21);
      ctx.font = '8px system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)';
      const words = ITEMS[t].desc.split(' ');
      ctx.fillText(words.slice(0, 2).join(' '), x, y + 33); ctx.fillText(words.slice(2).join(' '), x, y + 42);
    });
    label('COINS ' + wallet + '    KEYS ' + keys + '    BEST ' + Math.floor(best), W / 2, 674, 11, 'center', '#fff');
  }

  const BTN = { revive: { x: 120, y: 404, w: 240, h: 54 }, retry: { x: 120, y: 472, w: 240, h: 54 } };
  function drawDead() {
    ctx.fillStyle = 'rgba(14,6,40,.6)'; ctx.fillRect(0, 0, W, H);
    label('CAUGHT!', W / 2, 96, 52, 'center', titleGrad(W / 2, 160));
    label('SCORE ' + Math.floor(score), W / 2, 176, 26, 'center', '#fff');
    label('COINS ' + coinsRun + '    BEST ' + Math.floor(best), W / 2, 220, 16, 'center', '#ffe9a8');
    if (score >= best && score > 0) label('NEW BEST!', W / 2, 252, 18, 'center', '#7dffb0');
    const btn = (b, text, sub, c1, c2, on) => {
      const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0); g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.save(); ctx.globalAlpha = on ? 1 : 0.4; ctx.fillStyle = g; rr(b.x, b.y, b.w, b.h, 16); ctx.fill(); ctx.restore();
      label(text, b.x + b.w / 2, b.y + 9, 19, 'center'); if (sub) label(sub, b.x + b.w / 2, b.y + 33, 10, 'center', '#fff');
    };
    btn(BTN.revive, 'CONTINUE', 'Use a key  ·  R  ·  you have ' + keys, '#ffb300', '#ff5e3a', keys > 0);
    btn(BTN.retry, 'RETRY', 'Space / Enter', '#12d6a0', '#0a8bd6', true);
    label(coarse ? '' : 'C = change hero', W / 2, 548, 12, 'center', '#fff');
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
    drawSky();
    drawGround();
    drawWorld();
    // fog at horizon
    const fg = ctx.createLinearGradient(0, HOR - 6, 0, HOR + 60);
    fg.addColorStop(0, rgb(cur.bot, 1, 0.5)); fg.addColorStop(1, rgb(cur.bot, 1, 0));
    ctx.fillStyle = fg; ctx.fillRect(0, HOR - 6, W, 70);
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * p.life / p.max), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (cur.rain > 0.05) {
      ctx.strokeStyle = 'rgba(220,235,255,' + 0.4 * cur.rain + ')'; ctx.lineWidth = 1.3; ctx.beginPath();
      for (const d of drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * 0.1, d.y - d.l); }
      ctx.stroke();
    }
    // speed lines
    if (state === 'run' && speed > 900) {
      const a = clamp((speed - 900) / 600, 0, 0.35) + (hero.jetT > 0 ? 0.15 : 0);
      ctx.strokeStyle = 'rgba(255,255,255,' + a + ')'; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let i = 0; i < 14; i++) {
        const ang = hash(i * 3 + Math.floor(time * 12)) * TAU, r0 = 150 + hash(i + 9) * 90, r1 = r0 + 40 + hash(i + 4) * 70;
        ctx.moveTo(W / 2 + Math.cos(ang) * r0, 330 + Math.sin(ang) * r0 * 1.4); ctx.lineTo(W / 2 + Math.cos(ang) * r1, 330 + Math.sin(ang) * r1 * 1.4);
      }
      ctx.stroke();
    }
    ctx.restore();

    if (state === 'idle') { drawSelect(); return; }
    drawHUD();
    if (state === 'dead') drawDead();
    if (paused) {
      ctx.fillStyle = 'rgba(14,6,40,.6)'; ctx.fillRect(0, 0, W, H);
      label('PAUSED', W / 2, 300, 44, 'center', titleGrad(W / 2, 120));
      label('PRESS P TO RESUME', W / 2, 360, 14, 'center', '#ffe9a8');
    }
  }

  /* ---------- input ---------- */
  function pickHero(i) { sel = (i + CHARS.length) % CHARS.length; }
  function toSelect() { paused = false; reset(false); }
  function togglePause() { if (state === 'run') { paused = !paused; document.getElementById('pause').textContent = paused ? 'Resume' : 'Pause'; } }
  function start() { ensureAudio(); paused = false; startRun(); }
  document.getElementById('change').addEventListener('click', e => { toSelect(); e.currentTarget.blur(); });
  document.getElementById('pause').addEventListener('click', e => { togglePause(); e.currentTarget.blur(); });

  cv.tabIndex = 0;
  try { window.focus(); cv.focus({ preventScroll: true }); } catch (err) {}
  document.addEventListener('pointerdown', () => { try { window.focus(); } catch (err) {} }, true);

  window.addEventListener('keydown', e => {
    const k = e.code || e.key;
    const move = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
    if (move.indexOf(k) >= 0 || e.key === ' ') e.preventDefault();
    if (state === 'idle') {
      if (k === 'ArrowLeft' || k === 'KeyA') pickHero(sel - 1);
      else if (k === 'ArrowRight' || k === 'KeyD') pickHero(sel + 1);
      else if (k === 'Digit1' || k === 'Digit2' || k === 'Digit3') pickHero(Number(k.slice(-1)) - 1);
      else if (k === 'Space' || k === 'Enter' || k === 'ArrowUp' || k === 'ArrowDown' || e.key === ' ') start();
      else if (k === 'KeyM') toggleSound();
      return;
    }
    if (state === 'dead') {
      if (k === 'KeyR' || k === 'KeyK') revive();
      else if ((k === 'Space' || k === 'Enter' || e.key === ' ') && performance.now() - deadAt > 350) start();
      else if (k === 'KeyC') toSelect();
      else if (k === 'KeyM') toggleSound();
      return;
    }
    if (k === 'KeyP' || k === 'Escape') { togglePause(); return; }
    if (e.repeat) return;
    if (k === 'ArrowLeft' || k === 'KeyA') doLane(-1);
    else if (k === 'ArrowRight' || k === 'KeyD') doLane(1);
    else if (k === 'ArrowUp' || k === 'KeyW' || k === 'Space' || e.key === ' ') doJump();
    else if (k === 'ArrowDown' || k === 'KeyS') doRoll();
    else if (k === 'KeyM') toggleSound();
  });
  window.addEventListener('blur', () => { if (state === 'run' && !paused) togglePause(); });

  // swipe / tap
  let ptr = null;
  function canvasPoint(e) {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
  }
  const inB = (p, b) => p[0] >= b.x && p[0] <= b.x + b.w && p[1] >= b.y && p[1] <= b.y + b.h;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); ensureAudio();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    const p = canvasPoint(e);
    if (state === 'idle') {
      for (let i = 0; i < CHARS.length; i++) {
        if (inB(p, CARD(i))) { if (i === sel) start(); else pickHero(i); return; }
      }
      if (p[1] > 520 && p[1] < 560) start();
      return;
    }
    if (state === 'dead') {
      if (inB(p, BTN.revive)) revive();
      else if (inB(p, BTN.retry) && performance.now() - deadAt > 350) start();
      return;
    }
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
  });
  cv.addEventListener('pointermove', e => {
    if (!ptr || ptr.id !== e.pointerId || ptr.done) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, T = 26;
    if (Math.abs(dx) < T && Math.abs(dy) < T) return;
    ptr.done = true;
    if (Math.abs(dx) > Math.abs(dy)) doLane(dx > 0 ? 1 : -1);
    else if (dy < 0) doJump(); else doRoll();
  });
  const endPtr = e => { if (ptr && ptr.id === e.pointerId) ptr = null; };
  cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('contextmenu', e => e.preventDefault());

  const bind = (id, fn) => { const b = document.getElementById(id); b.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); if (state === 'idle') { start(); return; } if (state === 'dead') { if (performance.now() - deadAt > 350) start(); return; } fn(); }); b.addEventListener('contextmenu', e => e.preventDefault()); };
  bind('bL', () => doLane(-1)); bind('bR', () => doLane(1)); bind('bU', doJump); bind('bD', doRoll);

  /* ---------- loop ---------- */
  let prev = performance.now();
  function frame(now) {
    let dt = (now - prev) / 1000;
    prev = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  try { document.fonts && document.fonts.load('20px Bungee'); } catch (e) {}
  reset(false);
  requestAnimationFrame(frame);
})();
</script>
</body>
